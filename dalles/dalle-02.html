<section class="section dalle">
  <div class="section-inner">
    <p class="eyebrow">Imagerie RTI</p>
    <p class="lede">Visualisation interactive : déplacez la souris pour changer la direction de la lumière et révéler les reliefs gravés.</p>

    <!-- 1. Inclure la bibliothèque Relight -->
    <script src="https://cdn.jsdelivr.net/npm/relight@1.0.0/dist/relight.min.js"></script>

    <!-- 2. Conteneur pour le visualiseur RTI -->
    <div style="position:relative; margin-top:1.5rem; background:#1a1816; border-radius:8px; overflow:hidden;">
      <canvas id="rti-canvas-02" style="width:100%; height:600px; display:block; cursor:pointer;"></canvas>
      <div style="position:absolute; bottom:0.6rem; left:0.6rem; right:0.6rem; display:flex; justify-content:space-between; pointer-events:none;">
        <span style="background:rgba(0,0,0,0.6); color:#f0ebe3; padding:0.2rem 0.6rem; font-size:0.7rem; border-radius:4px;">🖱️ Déplacez la souris pour orienter la lumière</span>
        <span style="background:rgba(0,0,0,0.6); color:#f0ebe3; padding:0.2rem 0.6rem; font-size:0.7rem; border-radius:4px;">RTI · Bidzar</span>
      </div>
    </div>

    <!-- 3. Script d'initialisation -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const canvas = document.getElementById('rti-canvas-02');
        
        // Initialiser le visualiseur Relight
        // ⚠️ CHEMIN CORRIGÉ : remonter d'un niveau avec ../
        const viewer = new Relight(canvas, {
          url: '../rti-2/',  // Le dossier rti-2 est à la racine, on remonte avec ../
          layout: 'image'
        });

        // Position initiale de la lumière (haut-droite)
        viewer.light = [0.4, 0.6, 1.0];
        viewer.render();

        // Interaction : la souris contrôle la direction de la lumière
        let isInteracting = false;
        canvas.addEventListener('mousedown', () => isInteracting = true);
        canvas.addEventListener('mouseup', () => isInteracting = false);
        canvas.addEventListener('mouseleave', () => isInteracting = false);

        canvas.addEventListener('mousemove', function(e) {
          if (!isInteracting) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * 2 - 1;
            const y = -(e.clientY - rect.top) / rect.height * 2 + 1;
            viewer.light = [x, y, 1.0];
            viewer.render();
          }
        });

        // Option : clic pour réinitialiser la lumière au centre
        canvas.addEventListener('click', function() {
          viewer.light = [0.0, 0.0, 1.0];
          viewer.render();
        });
      });
    </script>

    <!-- 4. Garder le lien de téléchargement en option -->
    <p style="margin-top:1.5rem;">
      <a class="bouton" href="https://github.com/yrosenius-hash/gravures-rupestres-bidzar/releases/download/rti-files/dalle-02.rti" download>Télécharger le fichier RTI</a>
    </p>
  </div>
</section>
